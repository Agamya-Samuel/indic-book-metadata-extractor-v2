[project]
name = "indic-book-metadata-extractor"
version = "0.1.0"
description = "OCR-powered metadata extraction from Indic language books"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Task queue
    "celery[redis]>=5.4",
    "redis>=5.0",
    # Data validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # PDF processing
    "pymupdf>=1.24",
    # Image processing
    "pillow>=10.3",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    # OCR
    "pytesseract>=0.3.10",
    "python-Levenshtein>=0.25",  # used by scripts/eval_model.py for CER/WER
    # LLM
    "instructor>=1.3",
    "httpx>=0.27",
    # Utilities
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    # Monitoring
    "newrelic>=10.0",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "aiosmtplib>=3.0",
    "email-validator>=2.2",
    "psutil>=7.2.2",
    "openpyxl>=3.1",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.4",
    "aiosqlite>=0.20",
]
# Telugu line OCR (OCR_TEL_ENGINE=line_model). The worker image bakes these
# plus the 310 MB weights; runtime never downloads them.
ocr-line = [
    "torch>=2.2",
    "transformers==4.46.*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: requires TEST_POSTGRES_URL pointing at a real Postgres (append-only trigger verification)",
]

[tool.ruff]
line-length = 120

# CPU-only torch for the Telugu line model; never pull the CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
