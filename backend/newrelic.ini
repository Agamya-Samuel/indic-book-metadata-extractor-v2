[newrelic]
license_key = %(NEW_RELIC_LICENSE_KEY)s
app_name = %(NEW_RELIC_APP_NAME)s
monitor_mode = true
log_file = stdout
log_level = info

# Transaction tracing
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
# 'obfuscated' keeps table/column names visible; use 'off' if schema is sensitive
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 0.5

# Error collection
error_collector.enabled = true
error_collector.capture_events = true

# Distributed tracing
distributed_tracing.enabled = true

# Datastore monitoring
datastore_tracer.database_name_reporting = true
datastore_tracer.instance_reporting = true

# Application logging (forward Python logs to New Relic)
application_logging.enabled = true
application_logging.forwarding.enabled = true
application_logging.forwarding.max_samples_stored = 1000
application_logging.local_decorating.enabled = true

# ASGI framework is auto-detected via ASGIApplicationWrapper; no explicit set needed
