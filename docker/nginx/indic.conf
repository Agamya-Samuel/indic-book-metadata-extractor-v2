# Single public entrypoint for the Indic Books stack.
#
# Dokploy/Traefik terminates TLS and forwards to this container on port 80:
#   /      -> Next.js frontend
#   /api/  -> FastAPI backend
#
# The backend and frontend containers are never routed publicly.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream indic_frontend {
    server frontend:3000;
    keepalive 16;
}

upstream indic_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Matches MAX_UPLOAD_SIZE_MB=200 with multipart overhead.
    client_max_body_size 256m;
    client_body_timeout 300s;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Keep the /api prefix: FastAPI mounts every route under /api.
    location /api/ {
        proxy_pass http://indic_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # SSE job progress must not be buffered, and long-running jobs need
        # a long read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://indic_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep Next.js streaming responses (RSC) unbuffered.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
