services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: indic_books
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init_extensions.sql:/docker-entrypoint-initdb.d/init_extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: 8g
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama-entrypoint.sh:/entrypoint.sh
      - ./docker/Modelfile.airavata:/models/Modelfile.airavata
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - OLLAMA_PRELOAD_MODEL=airavata
      - OLLAMA_KEEP_ALIVE=30m
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/indic_books
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - OLLAMA_URL=http://ollama:11434
      - STORAGE_PATH=/app/storage
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-Indic Book Metadata Extractor}
      - NEW_RELIC_ENABLED=${NEW_RELIC_ENABLED:-false}
      - NEW_RELIC_CONFIG_FILE=/app/newrelic.ini
      - NEW_RELIC_ENVIRONMENT=${NEW_RELIC_ENVIRONMENT:-production}
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=${NEW_RELIC_DISTRIBUTED_TRACING_ENABLED:-true}
      - NEW_RELIC_LOG=${NEW_RELIC_LOG:-error}
      - NEW_RELIC_MONITOR_MODE=${NEW_RELIC_MONITOR_MODE:-true}
      - NEW_RELIC_DEVELOPER_MODE=${NEW_RELIC_DEVELOPER_MODE:-false}
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./docker/scripts/backend-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    command: ["uv", "run", "newrelic-admin", "run-program", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  worker-ocr:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    mem_limit: 4g
    command: ["uv", "run", "newrelic-admin", "run-program", "celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=8", "--hostname=ocr@%h", "-Q", "ocr,default"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/indic_books
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - OLLAMA_URL=http://ollama:11434
      - STORAGE_PATH=/app/storage
      - OCR_BATCH_SIZE=${OCR_BATCH_SIZE:-10}
      - OCR_THREAD_WORKERS=${OCR_THREAD_WORKERS:-4}
      - OCR_RENDER_DPI=${OCR_RENDER_DPI:-300}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-Indic Book Metadata Extractor Worker}
      - NEW_RELIC_ENABLED=${NEW_RELIC_ENABLED:-false}
      - NEW_RELIC_CONFIG_FILE=/app/newrelic.ini
      - NEW_RELIC_ENVIRONMENT=${NEW_RELIC_ENVIRONMENT:-production}
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=${NEW_RELIC_DISTRIBUTED_TRACING_ENABLED:-true}
      - NEW_RELIC_LOG=${NEW_RELIC_LOG:-error}
      - NEW_RELIC_MONITOR_MODE=${NEW_RELIC_MONITOR_MODE:-true}
      - NEW_RELIC_DEVELOPER_MODE=${NEW_RELIC_DEVELOPER_MODE:-false}
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  worker-llm:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    mem_limit: 2g
    command: ["uv", "run", "newrelic-admin", "run-program", "celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2", "--hostname=llm@%h", "-Q", "llm"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/indic_books
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - OLLAMA_URL=http://ollama:11434
      - STORAGE_PATH=/app/storage
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-Indic Book Metadata Extractor Worker LLM}
      - NEW_RELIC_ENABLED=${NEW_RELIC_ENABLED:-false}
      - NEW_RELIC_CONFIG_FILE=/app/newrelic.ini
      - NEW_RELIC_ENVIRONMENT=${NEW_RELIC_ENVIRONMENT:-production}
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=${NEW_RELIC_DISTRIBUTED_TRACING_ENABLED:-true}
      - NEW_RELIC_LOG=${NEW_RELIC_LOG:-error}
      - NEW_RELIC_MONITOR_MODE=${NEW_RELIC_MONITOR_MODE:-true}
      - NEW_RELIC_DEVELOPER_MODE=${NEW_RELIC_DEVELOPER_MODE:-false}
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000/api}
        - NEXT_PUBLIC_OPENREFINE_URL=${NEXT_PUBLIC_OPENREFINE_URL:-http://localhost:3333}
        - NEXT_PUBLIC_NEW_RELIC_LICENSE_KEY=${NEXT_PUBLIC_NEW_RELIC_LICENSE_KEY:-}
        - NEXT_PUBLIC_NEW_RELIC_APP_ID=${NEXT_PUBLIC_NEW_RELIC_APP_ID:-}
        - NEXT_PUBLIC_NEW_RELIC_ACCOUNT_ID=${NEXT_PUBLIC_NEW_RELIC_ACCOUNT_ID:-}
        - NEW_RELIC_ENABLED=${NEW_RELIC_ENABLED:-false}
        - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
        - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-Indic Book Metadata Extractor}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_OPENREFINE_URL=${NEXT_PUBLIC_OPENREFINE_URL:-http://localhost:3333}
      - NEW_RELIC_ENABLED=${NEW_RELIC_ENABLED:-false}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-Indic Book Metadata Extractor}
    depends_on:
      - backend

  flower:
    image: mher/flower:latest
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH}
    depends_on:
      redis:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - ./docker/scripts/backup-db.sh:/backup-db.sh:ro
      - backup_data:/backups
    environment:
      - PGHOST=postgres
      - PGUSER=postgres
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=indic_books
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache bash &&
      while true; do
        /backup-db.sh
        sleep 86400
      done
      "
    depends_on:
      postgres:
        condition: service_healthy

  newrelic-infra:
    image: newrelic/infrastructure-bundle:latest
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    environment:
      NRIA_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NRIA_DISPLAY_NAME: indic-books-host
      NRIA_DOCKER: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
      - ./docker/newrelic/nri-postgresql.yml:/etc/newrelic-infra/integrations.d/nri-postgresql.yml
    pid: host
    profiles:
      - monitoring

  # ─────────────────────────────────────────────────────────────────────────────
  # Wikibase (structured data store)
  # ─────────────────────────────────────────────────────────────────────────────
  wikibase:
    image: wikibase/wikibase:7
    restart: unless-stopped
    ports:
      - "8181:80"
    environment:
      DB_SERVER: mysql:3306
      DB_USER: wikibase
      DB_PASS: ${MYSQL_PASSWORD}
      DB_NAME: wikibase
      MW_ADMIN_NAME: admin
      MW_ADMIN_PASS: ${WIKIBASE_ADMIN_PASS}
      MW_ADMIN_EMAIL: admin@localhost
      MW_WG_SERVER: "http://localhost:8181"
      MW_WG_SITENAME: IndicBooks
      MW_WG_LANGUAGE_CODE: en
      WIKIBASE_PUBLIC_HOST: ${WIKIBASE_HOST:-localhost:8181}
      WIKIBASE_PUBLIC_SCHEME: ${WIKIBASE_SCHEME:-http}
      ELASTICSEARCH_HOST: elasticsearch
      METADATA_CALLBACK: "false"
      MW_SECRET_KEY: ${MW_SECRET_KEY:-}
      MW_UPGRADE_KEY: ${MW_UPGRADE_KEY:-}
    volumes:
      - wikibase_config:/config
      - ./docker/wikibase/config/LocalSettings.MediaWiki.php:/LocalSettings.MediaWiki.php
      - ./docker/wikibase/config/LocalSettings.Extensions.php:/LocalSettings.Extensions.php
      - wikibase_data:/var/www/html/images
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wikibase
      MYSQL_USER: wikibase
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: wikibase/elasticsearch:1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────────
  # OpenRefine (bulk data cleaning GUI)
  # ─────────────────────────────────────────────────────────────────────────────
  openrefine:
    build:
      context: ./docker/openrefine
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      - openrefine_data:/refine

volumes:
  pgdata:
  redis_data:
  ollama_data:
  backup_data:
  wikibase_config:
  wikibase_data:
  mysql_data:
  elasticsearch_data:
  openrefine_data:
